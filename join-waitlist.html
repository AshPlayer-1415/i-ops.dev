<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Request private access | I-Ops</title>
<script>document.documentElement.classList.add("js");</script>
<link rel="stylesheet" href="styles.css" />
<style>
  body.waitlist-page {
    min-height: 100vh;
    background: #cfe0ee url("assets/waitlist-sky.png") center top / cover no-repeat;
  }
  .waitlist-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .waitlist-nav {
    padding: 28px 0;
  }
  .waitlist-nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .waitlist-main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 70px var(--gutter) 90px;
  }
  .waitlist-panel {
    width: min(820px, 100%);
    text-align: center;
    padding: clamp(38px, 6vw, 70px);
    border-radius: var(--r-xl);
    background: rgba(255,255,255,.68);
    box-shadow: 0 30px 90px rgba(20,21,26,.14), inset 0 0 0 1px rgba(255,255,255,.7);
    backdrop-filter: saturate(160%) blur(18px);
  }
  .waitlist-panel .lead {
    max-width: 56ch;
    margin: 22px auto 0;
    color: #3a4150;
  }
  .waitlist-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px 16px;
    margin: 36px auto 0;
    max-width: 660px;
  }
  .field {
    display: grid;
    gap: 8px;
  }
  .field.full {
    grid-column: 1 / -1;
  }
  .waitlist-form label {
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .waitlist-form input,
  .waitlist-form textarea {
    width: 100%;
    min-height: 54px;
    border: 1px solid rgba(20,21,26,.1);
    border-radius: 20px;
    padding: 14px 18px;
    font: inherit;
    color: var(--ink);
    background: rgba(255,255,255,.82);
    outline: none;
    resize: vertical;
  }
  .waitlist-form input {
    border-radius: var(--r-pill);
  }
  .waitlist-form textarea {
    min-height: 112px;
    line-height: 1.45;
  }
  .waitlist-form input:focus,
  .waitlist-form textarea:focus {
    border-color: rgba(47,111,237,.45);
    box-shadow: 0 0 0 4px rgba(47,111,237,.12);
  }
  .waitlist-form .btn {
    grid-column: 1 / -1;
    min-height: 56px;
    width: 100%;
  }
  .waitlist-form .btn:disabled {
    opacity: .68;
    cursor: wait;
    transform: none;
    box-shadow: none;
  }
  .honeypot-field {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
  .waitlist-note {
    min-height: 1.5rem;
    margin-top: .875rem;
    text-align: center;
    color: #5f6774;
    font-weight: 600;
    font-size: .9rem;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .waitlist-note.is-loading {
    color: #5f6774;
  }
  .waitlist-note.is-success {
    color: #117a4b;
  }
  .waitlist-note.is-error {
    color: #b42318;
  }
  @media (max-width: 600px) {
    .waitlist-main {
      padding-inline: var(--gutter);
    }
    .waitlist-form {
      grid-template-columns: 1fr;
    }
    .waitlist-nav .wrap {
      gap: 18px;
    }
    .waitlist-nav .btn {
      padding-inline: 18px;
    }
  }
</style>
</head>
<body class="waitlist-page">
  <div class="waitlist-shell">
    <header class="waitlist-nav">
      <div class="wrap">
        <a href="./" class="brand">i-Ops</a>
        <a href="./" class="btn btn-light">Back to home</a>
      </div>
    </header>

    <main class="waitlist-main">
      <section class="waitlist-panel" aria-labelledby="waitlistTitle">
        <span class="eyebrow">Early access</span>
        <h1 class="h-display" id="waitlistTitle" style="margin-top:20px;">Request private access</h1>
        <p class="lead">Get early access to our pre-production builds and test I-Ops locally for your internal operations. The Mac version will be available first, and we will share it as soon as it is ready.</p>
        <form class="waitlist-form" id="private-access-form">
          <div class="honeypot-field">
            <label for="website">Website</label>
            <input id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" placeholder="Your name" required />
          </div>
          <div class="field">
            <label for="workEmail">Work email</label>
            <input id="workEmail" name="workEmail" type="email" autocomplete="email" placeholder="you@company.com" required />
          </div>
          <div class="field full">
            <label for="linkedinProfile">LinkedIn profile <span class="muted">(optional)</span></label>
            <input id="linkedinProfile" name="linkedinProfile" type="url" autocomplete="url" placeholder="https://www.linkedin.com/in/your-profile" />
          </div>
          <div class="field">
            <label for="role">Role</label>
            <input id="role" name="role" autocomplete="organization-title" placeholder="Operations lead" required />
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input id="company" name="company" autocomplete="organization" placeholder="Company name" required />
          </div>
          <div class="field full">
            <label for="location">Location</label>
            <input id="location" name="location" autocomplete="address-level2" placeholder="City, state, or country" required />
          </div>
          <div class="field full">
            <label for="expectedFeatures">What features are you expecting from the pre-production version of i-Ops? <span class="muted">(optional)</span></label>
            <textarea id="expectedFeatures" name="expectedFeatures" placeholder="File search, local reports, approvals, audit logs, integrations..."></textarea>
          </div>
          <div class="field full">
            <label for="requirements">Suggestions and customizations specific to your requirements <span class="muted">(optional)</span></label>
            <textarea id="requirements" name="requirements" placeholder="Share anything specific to your workflows, compliance needs, or team setup."></textarea>
          </div>
          <button class="btn btn-dark" id="private-access-submit" type="submit" aria-busy="false">Request Private Access</button>
        </form>
        <p class="waitlist-note" id="private-access-status" aria-live="polite" hidden></p>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const PRIVATE_ACCESS_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbw7XgSmH1OQxBDuXb0hwkNxurBc_TQHYX87nQ1uMVbNeiFFXWx-v6C7y6B1tZFm8PRcdw/exec";

      var form = document.getElementById("private-access-form");
      var submitButton = document.getElementById("private-access-submit");
      var statusElement = document.getElementById("private-access-status");
      var defaultButtonText = submitButton ? submitButton.textContent : "Request Private Access";
      var submissionInProgress = false;
      if (!form || !submitButton || !statusElement) return;

      function endpointIsConfigured() {
        return PRIVATE_ACCESS_ENDPOINT &&
          PRIVATE_ACCESS_ENDPOINT.indexOf("https://script.google.com/macros/s/") === 0 &&
          PRIVATE_ACCESS_ENDPOINT.slice(-5) === "/exec";
      }

      function getPayload(formData) {
        return {
          name: String(formData.get("name") || "").trim(),
          workEmail: String(formData.get("workEmail") || "").trim().toLowerCase(),
          linkedinProfile: String(formData.get("linkedinProfile") || "").trim(),
          role: String(formData.get("role") || "").trim(),
          company: String(formData.get("company") || "").trim(),
          location: String(formData.get("location") || "").trim(),
          expectedFeatures: String(formData.get("expectedFeatures") || "").trim(),
          requirements: String(formData.get("requirements") || "").trim(),
          website: String(formData.get("website") || "").trim()
        };
      }

      function showStatus(message, state) {
        statusElement.textContent = message;
        statusElement.hidden = false;
        statusElement.classList.remove("is-loading", "is-success", "is-error");
        if (state) statusElement.classList.add("is-" + state);
      }

      function setSubmitting(submitting) {
        submissionInProgress = submitting;
        submitButton.disabled = submitting;
        submitButton.setAttribute("aria-busy", submitting ? "true" : "false");
        submitButton.textContent = submitting ? "Submitting request…" : defaultButtonText;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (submissionInProgress) return;

        if (!form.reportValidity()) return;

        var payload = getPayload(new FormData(form));

        if (!payload.name) {
          showStatus("Please enter your name.", "error");
          document.getElementById("name")?.focus();
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.workEmail)) {
          showStatus("Please enter a valid work email.", "error");
          document.getElementById("workEmail")?.focus();
          return;
        }

        if (payload.linkedinProfile) {
          try {
            var linkedinUrl = new URL(payload.linkedinProfile);
            if (linkedinUrl.protocol !== "http:" && linkedinUrl.protocol !== "https:") {
              throw new Error("Invalid protocol");
            }
          } catch (error) {
            showStatus("Please enter a valid LinkedIn profile URL.", "error");
            document.getElementById("linkedinProfile")?.focus();
            return;
          }
        }

        if (!endpointIsConfigured()) {
          showStatus("The request form is temporarily unavailable. Please try again later.", "error");
          return;
        }

        setSubmitting(true);
        showStatus("Submitting your request…", "loading");

        try {
          await fetch(PRIVATE_ACCESS_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            cache: "no-store",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
          });

          form.reset();
          showStatus("Your request was sent. We’ll review it and contact you by email.", "success");
        } catch (error) {
          showStatus("We couldn’t send your request. Please check your connection and try again.", "error");
        } finally {
          setSubmitting(false);
        }
      });
    })();
  </script>
</body>
</html>
